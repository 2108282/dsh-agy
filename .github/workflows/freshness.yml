name: Version freshness

# Scheduled, not per-PR: agy releases without any pull request here, so drift
# appears on its own timetable. A stale fallback is the most detectable
# fingerprint anomaly and nothing else notices it rotting.
on:
  schedule:
    # Mondays 06:17 UTC — weekly is well inside the one-minor tolerance, and an
    # off-the-hour minute avoids the top-of-hour runner crunch.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  version-freshness:
    name: fallback trails the live feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Network is allowed HERE and nowhere else in the pipeline: `scripts/` is
      # the repo's sanctioned place for real HTTP (AGENTS.md), which is why the
      # unit suite can stay fixture-only.
      - name: Check version freshness
        id: check
        run: pnpm run verify:version-freshness
        continue-on-error: true
      # Alert only. Drift is not any PR author's fault, and the fix (bumping the
      # fallback and the pool) needs a human to confirm the release is real —
      # `versionPool` also carries platform strings that a bot must not touch.
      - name: Open or update the drift issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          TITLE='chore: Antigravity client version fallback is stale'
          BODY=$(printf '%s\n' \
            'The scheduled version-freshness check failed, so the compiled client version is no longer within one minor of the live feed.' \
            '' \
            'A stale version is the most detectable fingerprint anomaly: `AGY_VERSION_FALLBACK` and `versionPool` are what every User-Agent uses when the feed is unreachable.' \
            '' \
            'Fix: bump `AGY_VERSION_FALLBACK` (`src/oauth/constants.ts`) and `versionPool` (`src/runtime/fingerprint-data.json`) to the live release, then re-run the check.' \
            '' \
            'Exit code 2 means the feeds could not be reached, so freshness was NOT measured — re-run the workflow before bumping anything.' \
            '' \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
